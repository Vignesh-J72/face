<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            display: flex;
            height: 100vh;
            font-family: Arial;
            background-color: grey;
        }
        #left {
            width: 40%;
            padding: 20px;
            background:lightgray;
        }
        #right {
            width: 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
        }
        img {
            max-width: 100%;
            border: 2px solid #333;
        }
        pre {
            background: black;
            color: lime;
            padding: 10px;
            height: 200px;
            overflow: auto;
        }
        .detect-btn{
         background-color:lightgreen;
         border:none;
         padding:15px;
         cursor:pointer;

        }
        .attend-btn{
  background-color:powderblue;
  border:none;
  padding:15px;
  cursor:pointer;

}
.stop-btn{
  background-color: rgb(243, 6, 46);
  border:none;
  padding:15px;
  cursor:pointer;

}
    </style>
</head>

<body>

<div id="left">
    <button class="detect-btn" onclick="startDetect()">Start Detection</button>
    <button class="stop-btn" onclick="stopDetect()">Stop Detection</button>
    <button class="attend-btn" onclick="location.href='{% url 'database' %}'">Get Attendance</button>


    <p>Status: <b id="status">Idle</b></p>
    <p>Last Identity: <b id="identity">None</b></p>

    <h3>Logs</h3>
    <pre id="logs"></pre>
    <p>
    </p>
</div>

<div id="right">
    <img src="/video/" />
</div>

<script>
    let confirm_shown=false;
function startDetect() {
    fetch("/detect/");
    
}

function stopDetect() {
    fetch("/stop/");
}

function pollStatus() {
    fetch("/status/")
        .then(r => r.json())
        .then(d => {
            document.getElementById("status").innerText = d.status;
            document.getElementById("identity").innerText = d.last_identity;
            document.getElementById("logs").innerText = d.logs.join("\n");
            if (d.confirm_needed && !confirm_shown){
                confirm_shown=true;
                const confirmation=confirm('Clockout?');
                fetch('/confirmation',{
                    method:'POST',
                    headers:{
                        'Content-Type':'application/json',
                        'X-CSRFToken':getCookie('csrftoken')
                    },
                    body:JSON.stringify({
                        name:d.confirm_name,
                        response:confirmation
                    })
                });

            }
            if (!d.confirm_needed){
                confirm_shown=false;
            }
        })
    }

setInterval(pollStatus, 1000);
</script>

</body>
</html>
