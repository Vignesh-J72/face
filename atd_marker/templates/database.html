<!DOCTYPE html>
<html>
<head>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    padding: 30px;
}

#attendanceTable {
    width: 100%;
    border-collapse: collapse;
    background: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

#attendanceTable thead {
    background: #2c3e50;
    color: white;
}

#attendanceTable th,
#attendanceTable td {
    padding: 12px 15px;
    text-align: center;
}


#attendanceTable tbody tr:nth-child(even) {
    background: #f2f2f2;
}


#attendanceTable tbody tr:hover {
    background: #dfe6e9;
}


.present {
    background: #d4edda !important;
    color: #155724;
}

.absent {
    background: #f8d7da !important;
    color: #721c24;
}
.home-btn{
  background-color: cornflowerblue;
  border:none;
  padding:15px;
  cursor:pointer;

}
.add-child{
  background-color: rgb(1, 88, 249);
  border:none;
  padding:15px;
  cursor:pointer;

}

</style>
</head>

<body>

<h2>Attendance Records</h2>

<table id="attendanceTable">
  <thead>
    <tr>
      <th>Name</th>
      <th>Date</th>
      <th>Status</th>
      <th>Clock In</th>
      <th>Clock Out</th>
      <th>Total Time Worked</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
function getAttendance() {
  fetch("/attendance/")
    .then(res => res.json())
    .then(data => {
      const tbody = document.querySelector("#attendanceTable tbody");
      tbody.innerHTML = "";

      data.forEach(item => {
        const row = document.createElement("tr");

        // status-based class
        const statusClass =
          item.Status === "Present" ? "present" :
          item.Status === "Absent" ? "absent" : "";

        row.className = statusClass;

        row.innerHTML = `
          <td>${item.name}</td>
          <td>${item.date}</td>
          <td>${item.Status || "-"}</td>
          <td>${item["Clocked in at"] || "-"}</td>
          <td>${item["Clocked out at"] || "-"}</td>
          <td>${item["Total time worked"] || "-"}</td>
          <td>${item.Action || "-"}</td>
        `;

        tbody.appendChild(row);
      });
    });
}
function add_data(){
  const tbody=document.querySelector("#attendanceTable tbody");
  if (document.getElementById("manualRow")) return;
  const row=document.createElement('tr');
  row.id='manualRow';
  row.className='manual';
   row.innerHTML = `
    <td><input type="text" id="m_name" placeholder="Name"></td>
    <td><input type="date" id="m_date"></td>
    <td>
      <select id="m_status">
        <option value="Present">Present</option>
        <option value="Absent">Absent</option>
      </select>
    </td>
    <td><input type="time" id="m_in"></td>
    <td><input type="time" id="m_out"></td>
  `;
  tbody.appendChild(row);
  add_data_cfm();
}
function add_data_cfm(){
  const row = document.getElementById("manualRow");

  const actionCell = document.createElement("td");
  actionCell.innerHTML = `
    <button onclick="pushFirebase()">✔</button>
    <button onclick="cancelManualEntry()">✖</button>
  `;

  row.appendChild(actionCell);
}

function cancelManualEntry() {
  document.getElementById("manualRow")?.remove();
}
function pushFirebase(){
  const rawDate=document.getElementById("m_date").value;
  const payload = {
    name: document.getElementById("m_name").value.trim(),
    date: formatDateToDDMMYY(rawDate),
    Status: document.getElementById("m_status").value,
    "Clocked in at": document.getElementById("m_in").value,
    "Clocked out at": document.getElementById("m_out").value
  };
  if (!payload.name || !payload.date) {
    alert("Name and Date are required");
    return;
  }

  fetch("/manual-entry/", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": getCSRFToken()
    },
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(result => {
    if (result.success) {
      document.getElementById("manualRow").remove();
      getAttendance(); 
    } else {
      alert(result.error);
    }
  });
}
function getCSRFToken(){
  return document.cookie.split('; ')
    .find(row => row.startsWith('csrftoken='))
    .split('=')[1];
}
function formatDateToDDMMYY(isoDate) {
  if (!isoDate) return "";
  const [year, month, day] = isoDate.split("-");
  return `${day}-${month}-${year}`;
}
getAttendance();
</script>
<p>
  <button class="home-btn" onclick="location.href='{% url 'home' %}'">Back to Home</button>
  <button class="add-child" onclick="add_data()">Add Attendance data</button>
</p>
</body>
</html>
