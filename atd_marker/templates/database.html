<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <table border="1" id="attendanceTable">
  <thead>
    <tr>
      <th>Name</th>
      <th>Date</th>
      <th>Status</th>
      <th>Clock In</th>
      <th>Clock Out</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
function getAttendance() {
  fetch("/attendance/")
    .then(res => res.json())
    .then(data => {
      const tbody = document.querySelector("#attendanceTable tbody");
      tbody.innerHTML = ""; // clear old rows

      // data = Attendance object
      for (const name in data) {
        const person = data[name];

        for (const date in person) {
          const day = person[date];

          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${name}</td>
            <td>${date}</td>
            <td>${day["Status"] || "-"}</td>
            <td>${day["Clocked in at"] || "-"}</td>
            <td>${day["Clocked out at"] || "-"}</td>
          `;

          tbody.appendChild(row);
        }
      }
    });
}
getAttendance();
</script>
</body>
</html>
